<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Geography Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <div id="splash-title">Geography Game</div>
        <button id="start-button" type="button">Start</button>
    </div>

    <!-- Game Container -->
    <div id="game-container">
        <button id="settings-button" type="button" aria-label="Settings" aria-expanded="false" title="Settings">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path fill="currentColor" d="M19.14 12.94a7.49 7.49 0 0 0 .05-.94 7.49 7.49 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.74 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.03.31-.05.62-.05.94 0 .32.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.25.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
            </svg>
        </button>

        <div id="settings-panel" hidden>
            <div class="settings-title">Settings</div>
            <label class="settings-row">
                <span>Music</span>
                <input type="checkbox" id="toggle-music" checked />
                <span class="switch" aria-hidden="true"></span>
            </label>
            <label class="settings-row">
                <span>Sound effects</span>
                <input type="checkbox" id="toggle-sfx" checked />
                <span class="switch" aria-hidden="true"></span>
            </label>
            <button id="reset-button" type="button">Reset progress</button>
        </div>

        <div id="counters">
            <div class="counter">
                <div class="counter-label">Streak</div>
                <div id="streak-roller" class="roller streak-roller" aria-label="Current streak"></div>
            </div>
            <div class="counter">
                <div class="counter-label">Total</div>
                <div id="total-roller" class="roller total-roller" aria-label="Total correct"></div>
            </div>
        </div>

        <div id="map"></div>

        <div id="question-row">
            <img id="country-flag" src="" alt="" hidden />
            <div id="country">Loading&hellip;</div>
        </div>

        <div id="result" aria-live="polite" role="status"></div>

        <div id="action-buttons">
            <button id="skip-button" class="action-button action-button-skip" type="button" title="Skip (S)">Skip</button>
            <button id="capital-button" class="action-button action-button-capital" type="button" hidden title="Guess capital (C)">Guess Capital</button>
            <button id="next-button" class="action-button action-button-primary" type="button" hidden title="Next (Space)">Next</button>
        </div>

        <div id="continent-buttons" class="choice-grid" role="group" aria-label="Continent choices"></div>
        <div id="capital-buttons" class="choice-grid" role="group" aria-label="Capital choices" hidden></div>
    </div>

    <script src="capitals.js"></script>
    <script src="game.js"></script>
</body>
</html>
